name: paper-era5-wb2
data:
  root: data/era5-wb2
  splits:
    train:
      hr: train_hr.npy
      lr: train_lr.npy
    test2009:
      hr: test2009_hr.npy
      lr: test2009_lr.npy
    test2020:
      hr: test2020_hr.npy
      lr: test2020_lr.npy
  train_split: train
  test_splits:
  - test2009
  - test2020
  hr_shape:
  - 256
  - 512
  lr_shape:
  - 64
  - 128
  frame_offsets:
  - -2
  - -1
  - 0
  - 1
  hr_max: 41.747352600097656
  lr_max: 34.28621292114258
  standardize: true
  stats:
    lr_mean: 0.1855108917167912
    lr_var: 0.010504203594617019
    hr_mean: 0.15221083291906334
    hr_var: 0.007834514283830127
model:
  widths:
  - 64
  - 128
  - 256
  - 384
  block_depth: 3
  embedding_dims: 64
  embedding_max_frequency: 1000.0
  bottleneck_attention: true
  schedule: cosine
  min_signal_rate: 0.015
  max_signal_rate: 0.95
  ema_decay: 0.999
train:
  batch_size: 4
  max_steps: 110000
  lr: 0.0001
  lr_final: 1.0e-05
  weight_decay: 1.0e-05
  weight_decay_final: 1.0e-06
  precision: 16-mixed
  val_every_n_steps: 1000
  val_batches: 2
  seed: 0
  num_workers: 4
  out_dir: runs/paper
sample:
  diffusion_steps: 5
  ensemble_size: 15
  batch_size: 32
synthetic:
  num_train: 400
  num_test: 120
  blur_sigma: 2.0
  seed: 0
era5:
  bucket_root: gs://weatherbench2/datasets/era5
  hr_store: 1959-2022-6h-512x256_equiangular_conservative.zarr
  lr_store: 1959-2022-6h-128x64_equiangular_conservative.zarr
  variable: 10m_wind_speed
  years:
    train:
    - 2010
    - 2011
    - 2012
    - 2013
    - 2014
    - 2015
    - 2016
    - 2017
    - 2018
    - 2019
    test2009:
    - 2009
    test2020:
    - 2020
